[workspace]
members = ["crates/easy-archive-core", "crates/easy-archive-cli", "crates/easy-archive-windows", "src-tauri"]
default-members = ["crates/easy-archive-core", "crates/easy-archive-cli", "crates/easy-archive-windows"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = "4.5"
time = { version = "0.3", features = ["parsing", "formatting"] }
sha2 = "0.10"
cap-std = "4"
cap-fs-ext = "4"
uuid = { version = "1", features = ["v4"] }
ctrlc = "3"
tempfile = "3"
fs4 = "1.1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

